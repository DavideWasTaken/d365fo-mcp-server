name: Sync upstream

# Merges upstream main into this fork's main every night, keeping the fork's
# own commits.
#
# 1. Merge upstream (no commit yet) and run the VM-free checks
#    (.github/scripts/upstream-sync-gate.sh).
# 2. With no conflicts and every check green, push the merge commit to main.
# 3. Otherwise push a sync/upstream-* branch with the merge (conflict markers
#    included), open a PR on the fork for a manual look, and fail, so GitHub
#    notifies the owner. Opening the PR needs "Allow GitHub Actions to create
#    and approve pull requests" in the repository settings.
#
# Secrets: UPSTREAM_SYNC_TOKEN (Contents + Workflows write on this fork; needed
# when upstream edits .github/workflows). With Pull requests write too, it opens
# the PR, so the PR's CI runs at once.

on:
  schedule:
    # 02:17 Rome, off the top of the hour, when GitHub delays scheduled runs the most.
    - cron: '17 2 * * *'
      timezone: Europe/Rome
  workflow_dispatch:
    inputs:
      dry_run_from:
        description: >-
          Test run: start from this older fork commit instead of main (for example
          one before an upstream merge that conflicted), and push nothing.
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

env:
  UPSTREAM_REPO: dynamics365ninja/d365fo-mcp-server
  NODE_VERSION: '24.x'

jobs:
  sync:
    # Any repository except upstream itself, so renaming the fork keeps the sync running.
    if: github.repository != 'dynamics365ninja/d365fo-mcp-server' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out fork main with full history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # For upstream workflow edits, use a token limited to this fork with
          # Contents and Workflows write permissions; otherwise fail safely.
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      # Run from a copy taken before anything changes the tree, so the merge
      # cannot alter the checks that decide the push.
      - name: Keep a copy of the checks
        run: cp .github/scripts/upstream-sync-gate.sh "$RUNNER_TEMP/upstream-sync-gate.sh"

      - name: Start from an older fork commit (test run)
        if: inputs.dry_run_from != ''
        env:
          FROM: ${{ inputs.dry_run_from }}
        run: |
          git reset --hard "$FROM"
          echo "Test run from $(git log --oneline -1): nothing will be pushed." >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch upstream main
        id: fetch
        shell: bash
        run: |
          set -euo pipefail
          if ! git fetch --no-tags --no-recurse-submodules \
            "https://github.com/${UPSTREAM_REPO}.git" \
            refs/heads/main:refs/remotes/upstream/main; then
            echo '::error::Could not fetch upstream main. No changes were pushed.'
            exit 1
          fi
          upstream_sha=$(git rev-parse refs/remotes/upstream/main)
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo 'Already up to date with upstream; personal fork commits preserved.' >> "$GITHUB_STEP_SUMMARY"
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.fetch.outputs.needed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Installed for the fork's current main; the gate reinstalls when the
      # merge changes the lockfile (a conflicted lockfile would not install).
      - name: Install dependencies
        if: steps.fetch.outputs.needed == 'true'
        run: npm ci --no-audit --no-fund

      - name: Merge upstream main without committing
        id: merge
        if: steps.fetch.outputs.needed == 'true'
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.fetch.outputs.upstream_sha }}
        run: |
          # Actions runs bash with -e; a conflicting merge must not end the step.
          set +e -uo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff "$UPSTREAM_SHA"
          if ! git rev-parse -q --verify MERGE_HEAD > /dev/null; then
            echo '::error::git merge stopped before starting (see the log above). No changes were pushed.'
            exit 1
          fi
          conflicts=$(git diff --name-only --diff-filter=U)
          mkdir -p "$RUNNER_TEMP/sync"
          echo "$conflicts" > "$RUNNER_TEMP/sync/conflicts.txt"
          if [ -n "$conflicts" ]; then
            echo 'conflicts=true' >> "$GITHUB_OUTPUT"
            { echo '### Conflicts'; echo "$conflicts" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'conflicts=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Check the merged tree
        id: precheck
        if: steps.merge.outputs.conflicts == 'false'
        continue-on-error: true
        run: bash "$RUNNER_TEMP/upstream-sync-gate.sh" .sync/precheck.log

      - name: Verify the merge
        id: verify
        if: steps.fetch.outputs.needed == 'true'
        continue-on-error: true
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.fetch.outputs.upstream_sha }}
          PRECHECK: ${{ steps.precheck.outcome }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          set +e -uo pipefail
          # Notes for this run, never committed.
          mkdir -p "$RUNNER_TEMP/sync"
          if [ -d .sync ]; then cp -r .sync/. "$RUNNER_TEMP/sync/"; rm -rf .sync; fi

          ok=true
          if [ "$(git symbolic-ref -q --short HEAD)" != main ] || \
             [ "$(git rev-parse -q --verify MERGE_HEAD)" != "$UPSTREAM_SHA" ]; then
            echo '::error::The working tree is no longer the merge of upstream into main.'
            exit 1
          fi
          # Only a merge without conflicts whose checks passed goes to main.
          if [ "$CONFLICTS" = true ]; then
            echo '::error::The merge has conflicts.'; ok=false
          fi
          if [ -f "$RUNNER_TEMP/sync/precheck.log" ]; then
            cp "$RUNNER_TEMP/sync/precheck.log" "$RUNNER_TEMP/sync/gate.log"
          fi
          if [ "$CONFLICTS" != true ] && [ "$PRECHECK" != success ]; then
            echo '::error::The checks failed on the merged tree.'; ok=false
          fi
          git add -A
          [ "$ok" = true ]

      - name: Push to main, or open a PR
        if: ${{ !cancelled() && steps.merge.outcome == 'success' }}
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.fetch.outputs.upstream_sha }}
          VERIFIED: ${{ steps.verify.outcome }}
          DRY_RUN: ${{ inputs.dry_run_from != '' }}
          GH_TOKEN: ${{ github.token }}
          # A PR opened with GITHUB_TOKEN starts no workflow, so its CI would never
          # run; opened with this token, it does.
          PR_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          short=${UPSTREAM_SHA:0:7}
          conflicts=$(grep -v '^$' "$RUNNER_TEMP/sync/conflicts.txt" || true)
          echo "Merge upstream main ($short)" > "$RUNNER_TEMP/sync/message.txt"

          if [ "$DRY_RUN" = true ]; then
            {
              echo "### Test run: verification $VERIFIED (nothing pushed)"
              echo
              echo '### Files that conflict'
              if [ -n "$conflicts" ]; then echo "$conflicts" | sed 's/^/- /'; else echo '(none)'; fi
            } >> "$GITHUB_STEP_SUMMARY"
            [ "$VERIFIED" = success ]
            exit
          fi

          open_sync_prs() {
            gh pr list -R "$GITHUB_REPOSITORY" --state open --json number,headRefName \
              -q '.[] | select(.headRefName | startswith("sync/upstream-")) | .number'
          }

          if [ "$VERIFIED" = success ]; then
            git commit -q -F "$RUNNER_TEMP/sync/message.txt"
            # A normal push also rejects concurrent fork changes; never force it.
            git push origin HEAD:refs/heads/main
            for n in $(open_sync_prs); do
              gh pr close "$n" -R "$GITHUB_REPOSITORY" --delete-branch \
                -c "Superseded: upstream $short was merged into main automatically." || true
            done
            echo "Merged upstream $short into main." >> "$GITHUB_STEP_SUMMARY"
            if ! node scripts/bridgeAttest.mjs check > /dev/null 2>&1; then
              echo '::warning::Bridge sources changed: run `npm run bridge:build` on the D365FO VM and commit bridge/build-attestation.json.'
            fi
            exit 0
          fi

          # Not verified: keep main as it was and hand the merge to the owner.
          # The branch holds the merge commit, conflict markers included: fix
          # them on the branch and the PR merges into main as is.
          branch="sync/upstream-$(date -u +%Y%m%d-%H%M)-$short"
          git add -A
          git commit -q --no-verify -F "$RUNNER_TEMP/sync/message.txt"
          git push origin "HEAD:refs/heads/$branch"
          {
            echo "The automatic merge of upstream $short could not be verified, so main was not changed."
            echo
            echo '### Files that conflict (markers committed on this branch)'
            if [ -n "$conflicts" ]; then echo "$conflicts" | sed 's/^/- /'; else echo '(none)'; fi
            echo
            echo '### Failed checks'
            echo '```'
            tail -n 60 "$RUNNER_TEMP/sync/gate.log" 2>/dev/null || echo '(no gate log)'
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/sync/pr.md"
          previous=$(open_sync_prs)
          create_pr() {
            gh pr create -R "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "Sync upstream $short (needs review)" --body-file "$RUNNER_TEMP/sync/pr.md"
          }
          # Without Pull requests write on UPSTREAM_SYNC_TOKEN, fall back to
          # GITHUB_TOKEN: the PR opens, but its CI starts only on the next push.
          if url=$( { [ -n "$PR_TOKEN" ] && GH_TOKEN="$PR_TOKEN" create_pr; } || create_pr); then
            for n in $previous; do
              gh pr close "$n" -R "$GITHUB_REPOSITORY" --delete-branch -c "Superseded by $url." || true
            done
          else
            # Creating PRs with GITHUB_TOKEN needs "Allow GitHub Actions to create
            # and approve pull requests" in the repository settings.
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch"
          fi
          cat "$RUNNER_TEMP/sync/pr.md" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Upstream merge needs review: $url"
          exit 1

      # The merge notes and the check logs, for a run that needs a look.
      - name: Keep the sync notes
        if: ${{ !cancelled() && steps.merge.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: sync-notes
          path: ${{ runner.temp }}/sync/
          if-no-files-found: ignore

  # Deletes fork branches whose work is finished: a pull request from the branch
  # (on upstream or on this fork) was merged or closed, and the branch still
  # points at the commit that pull request ended with. A branch with commits
  # after its PR, with an open PR, or with no PR at all is kept; branches without
  # a PR are listed in the run summary so they can be looked at. main and the
  # sync's own sync/upstream-* branches are never touched. A deleted branch can
  # be restored from its PR page.
  prune-branches:
    if: github.repository != 'dynamics365ninja/d365fo-mcp-server' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: .github/scripts

      - name: Delete branches whose PR is merged or closed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # A test run of the sync only reports what it would delete.
          DRY_RUN: ${{ inputs.dry_run_from != '' }}
        run: bash .github/scripts/prune-fork-branches.sh
